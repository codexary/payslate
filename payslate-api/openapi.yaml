openapi: 3.1.0
info:
  title: Payslate Online API
  version: 1.0.0
security:
  - staffBearer: []
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details; extension members may also be present.
      required: [status, title]
      properties:
        type: {type: string, format: uri-reference, default: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 100, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
  responses:
    BadRequest:
      description: The request contains invalid input, including unknown pay-run events.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller does not have permission for this request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested record is not visible to the caller, whether or not it exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The requested action conflicts with the current pay-run state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The upload exceeds the 1 MB file or request limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server error occurred; internal details are not returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /v1/employees:
    post:
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, employment, hourlyRate, bsb, account]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                employment: {type: string, enum: [PERMANENT, CASUAL]}
                hourlyRate: {type: number, minimum: 0, maximum: 9999.99, multipleOf: 0.01}
                bsb: {type: string}
                account: {type: string}
                deductions: {type: number, minimum: 0, maximum: 999999.99, multipleOf: 0.01, default: 0}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Employee ID
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v1/employees/{id}:
    get:
      operationId: getEmployee
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: Employee summary
          content:
            application/json:
              schema:
                type: object
                required: [id, name, employment, hourly_rate]
                properties:
                  id: {type: integer, format: int64}
                  name: {type: string}
                  employment: {type: string}
                  hourly_rate: {type: number}
  /v1/employees/search:
    get:
      operationId: searchEmployees
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Matching employees
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, hourly_rate]
                  properties:
                    id: {type: integer, format: int64}
                    name: {type: string}
                    hourly_rate: {type: number}
  /v1/timesheets:
    post:
      operationId: uploadTimesheets
      description: >-
        CSV must be UTF-8 (optional BOM), at most 1 MB and at most 10 000 data rows,
        with years 2000–2099. Quoted line breaks are rejected. Unknown extra columns
        are ignored; duplicated known columns are rejected. A header or row error names its line; a file that is not UTF-8 is rejected as a whole.
        Overlapping shifts for an employee are rejected within a file as 400 and against already-stored shifts as 409, naming the line.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Imported row count
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/pay-runs:
    post:
      operationId: createPayRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodStart, periodEnd]
              properties:
                periodStart: {type: string, format: date}
                periodEnd: {type: string, format: date}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Pay run ID
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer, format: int64}
  /v1/pay-runs/{id}:
    get:
      operationId: getPayRun
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string}
  /v1/pay-runs/calendar:
    post:
      operationId: createCalendarPayRun
      description: Derives an inclusive stored period from a calendar pay date. Weekly and fortnightly dates follow the anchor; monthly dates are month ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency, anchorPayDate, payDate]
              properties:
                frequency: {type: string, enum: [WEEKLY, FORTNIGHTLY, MONTHLY]}
                anchorPayDate: {type: string, format: date}
                payDate: {type: string, format: date}
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200':
          description: Pay run ID
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v1/pay-runs/{id}/{event}:
    post:
      operationId: transitionPayRun
      description: event is calculate, approve, pay or reverse; unknown events return 400.
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: New state
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/pay-runs/{id}/payslips/{employeeId}:
    get:
      operationId: getPayslip
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: Gross, tax and net
          content:
            application/json:
              schema:
                type: object
                required: [gross, tax, net]
                properties:
                  gross: {type: number}
                  tax: {type: number}
                  net: {type: number}
  /v1/pay-runs/{id}/aba:
    get:
      operationId: downloadAba
      responses:
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: ABA Direct Entry file
          content:
            text/plain:
              schema: {type: string}
