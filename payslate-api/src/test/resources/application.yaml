spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/payslate
          jwk-set-uri: http://localhost:9999/jwks
  datasource:
    url: jdbc:h2:mem:payslate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
