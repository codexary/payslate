spring:
  application:
    name: payslate-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYSLATE_OIDC_ISSUER_URI}
          jwk-set-uri: ${PAYSLATE_OIDC_JWKS_URI}
  datasource:
    url: ${PAYSLATE_DB_URL}
    username: ${PAYSLATE_DB_USER}
    password: ${PAYSLATE_DB_PASSWORD}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  tomcat:
    mbeanregistry:
      enabled: true
management:
  otlp:
    metrics:
      export:
        enabled: ${PAYSLATE_METRICS_EXPORT:false}
        url: ${PAYSLATE_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: ${PAYSLATE_METRICS_STEP:1m}
        base-time-unit: seconds
        publish-max-gauge-for-histograms: true
  metrics:
    enable:
      http.server.requests.active: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: ecs
payslate:
  time-zone: ${PAYSLATE_TIME_ZONE:Australia/Melbourne}
