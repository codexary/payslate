rules:
  - id: payslate.dynamic-jdbc-sql
    languages: [java]
    severity: ERROR
    message: Bind untrusted values in a prepared query.
    patterns:
      - pattern-either:
          - pattern: |
              String $SQL = $PREFIX + $INPUT + $SUFFIX;
              ...
              $JDBC.queryForList($SQL, ...);
          - pattern: |
              String $SQL = $PREFIX + $INPUT + $SUFFIX;
              ...
              $JDBC.queryForObject($SQL, ...);
          - pattern: |
              String $SQL = $PREFIX + $INPUT + $SUFFIX;
              ...
              $JDBC.query($SQL, ...);
          - pattern: |
              String $SQL = $PREFIX + $INPUT + $SUFFIX;
              ...
              $JDBC.update($SQL, ...);
          - pattern: |
              String $SQL = $PREFIX + $INPUT + $SUFFIX;
              ...
              $JDBC.execute($SQL, ...);
          - pattern: $JDBC.queryForList($SQL + $INPUT, ...)
          - pattern: $JDBC.queryForObject($SQL + $INPUT, ...)
          - pattern: $JDBC.query($SQL + $INPUT, ...)
          - pattern: $JDBC.update($SQL + $INPUT, ...)
          - pattern: $JDBC.execute($SQL + $INPUT, ...)
          - pattern: $STMT.executeQuery($SQL + $INPUT)
          - pattern: $CONN.prepareStatement($SQL + $INPUT)
      # A query split across two string literals is itself a constant: no
      # untrusted value reaches it, so joining literals must not be flagged.
      # A non-literal operand still carries input and keeps matching above.
      - pattern-not: $JDBC.queryForList("..." + "...", ...)
      - pattern-not: $JDBC.queryForObject("..." + "...", ...)
      - pattern-not: $JDBC.query("..." + "...", ...)
      - pattern-not: $JDBC.update("..." + "...", ...)
      - pattern-not: $JDBC.execute("..." + "...", ...)
      - pattern-not: $STMT.executeQuery("..." + "...")
      - pattern-not: $CONN.prepareStatement("..." + "...")
