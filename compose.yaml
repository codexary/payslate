services:
  observability:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:${PAYSLATE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/payslate.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/payslate.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  database:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: payslate
      POSTGRES_USER: ${PAYSLATE_DB_USER:?Set PAYSLATE_DB_USER}
      POSTGRES_PASSWORD: ${PAYSLATE_DB_PASSWORD:?Set PAYSLATE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d payslate"]
      interval: 5s
      timeout: 3s
      retries: 10
  issuer:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:${PAYSLATE_ISSUER_PORT:-8081}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PAYSLATE_DEV_ISSUER_ADMIN:?Set PAYSLATE_DEV_ISSUER_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PAYSLATE_DEV_ISSUER_PASSWORD:?Set PAYSLATE_DEV_ISSUER_PASSWORD}
    volumes:
      - ./payslate-api/dev-issuer:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${PAYSLATE_ISSUER_PORT:-8081}:8080"
  api:
    build: ./payslate-api
    environment:
      PAYSLATE_DB_URL: jdbc:postgresql://database:5432/payslate
      PAYSLATE_DB_USER: ${PAYSLATE_DB_USER:?Set PAYSLATE_DB_USER}
      PAYSLATE_DB_PASSWORD: ${PAYSLATE_DB_PASSWORD:?Set PAYSLATE_DB_PASSWORD}
      PAYSLATE_OIDC_ISSUER_URI: http://localhost:${PAYSLATE_ISSUER_PORT:-8081}/realms/payslate
      PAYSLATE_OIDC_JWKS_URI: http://issuer:8080/realms/payslate/protocol/openid-connect/certs
      PAYSLATE_TIME_ZONE: ${PAYSLATE_TIME_ZONE:-Australia/Melbourne}
      PAYSLATE_METRICS_EXPORT: ${PAYSLATE_METRICS_EXPORT:-true}
      PAYSLATE_OTLP_METRICS_URL: ${PAYSLATE_OTLP_METRICS_URL:-http://observability:4318/v1/metrics}
      PAYSLATE_METRICS_STEP: ${PAYSLATE_METRICS_STEP:-5s}
    ports:
      - "127.0.0.1:${PAYSLATE_API_PORT:-8080}:8080"
    depends_on:
      observability:
        condition: service_started
      database:
        condition: service_healthy
      issuer:
        condition: service_started
volumes:
  pgdata:
