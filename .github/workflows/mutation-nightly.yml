name: Full mutation analysis
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pay-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Skip the scheduled run when nothing landed in the last day; a manual
      # workflow_dispatch always runs.
      - name: Check for commits in the last 24 hours
        id: recent
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: steps.recent.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install upstream modules so -pl pay-engine resolves legacy-engine
        if: steps.recent.outputs.run == 'true'
        run: ./mvnw -B -ntp -pl pay-engine -am install -DskipTests
      - name: Mutate pay-engine
        if: steps.recent.outputs.run == 'true'
        run: ./mvnw -B -ntp -pl pay-engine test-compile org.pitest:pitest-maven:mutationCoverage
