name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Pdocker verify
  mutation-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mutate changed pay-engine classes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- pay-engine/src/main/java > changed-files.txt
          # Changed-files.txt only lists pay-engine main sources; install the
          # upstream modules once, and only when there is something to mutate.
          if [ -s changed-files.txt ]; then
            ./mvnw -B -ntp -pl pay-engine -am install -DskipTests
          fi
          while IFS= read -r source; do
            case "$source" in
              pay-engine/src/main/java/*.java)
                class_name="${source#pay-engine/src/main/java/}"
                class_name="${class_name%.java}"
                class_name="${class_name//\//.}"
                ./mvnw -B -ntp -pl pay-engine "-DtargetClasses=${class_name}*" test-compile org.pitest:pitest-maven:mutationCoverage -DfailWhenNoMutations=false
                ;;
            esac
          done < changed-files.txt

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -pl payslate-api -am -Dtest=ApiOpenApiContractTest -Dsurefire.failIfNoSpecifiedTests=false test
  system-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -pl payslate-api -am -Dtest=SystemWholePayrollFlowTest,AcceptanceMargaretPayrollTest -Dsurefire.failIfNoSpecifiedTests=false test
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: semgrep scan --config .semgrep/payslate.yml --error payslate-api/src/main/java
      - run: semgrep --test --config .semgrep/payslate.yml .semgrep/payslate.java
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Jazzer fuzzes one @FuzzTest per invocation; call each target separately so
      # neither is skipped. Keep the two together near two minutes of wall-clock time.
      - name: Fuzz the ABA parser (short)
        env:
          JAZZER_FUZZ: '1'
        run: ./mvnw -B -ntp -pl bank-file -am test -Dtest=AbaReferenceFuzzTest -Djazzer.max_duration=60s -Dsurefire.failIfNoSpecifiedTests=false
      - name: Fuzz the timesheet importer (short)
        env:
          JAZZER_FUZZ: '1'
        run: ./mvnw -B -ntp -pl payslate-api -am test -Dtest=TimesheetImporterFuzzTest -Djazzer.max_duration=60s -Dsurefire.failIfNoSpecifiedTests=false
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build aba-convert and run its regression scripts
        working-directory: legacy/aba-convert
        run: |
          make
          for t in tests/*.sh; do
            echo "== $t =="
            sh "$t"
          done
