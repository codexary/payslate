name: Tax schedule
on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'pay-engine/src/main/resources/example-tax-schedule.csv'
      - 'legacy-engine/src/main/resources/example-tax-schedule.csv'
      - '.github/workflows/tax-schedule.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tax-schedule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r analysis/requirements.txt
      - run: python analysis/tax_schedule_check.py
