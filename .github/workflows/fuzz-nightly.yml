name: Nightly fuzzing
on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jazzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Skip the scheduled run when nothing landed in the last day; a manual
      # workflow_dispatch always runs.
      - name: Check for commits in the last 24 hours
        id: recent
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: steps.recent.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # One target per invocation; the two together stay within ten minutes.
      - name: Fuzz the ABA parser (long)
        if: steps.recent.outputs.run == 'true'
        env:
          JAZZER_FUZZ: '1'
        run: ./mvnw -B -ntp -pl bank-file -am test -Dtest=AbaReferenceFuzzTest -Djazzer.max_duration=5m -Dsurefire.failIfNoSpecifiedTests=false
      - name: Fuzz the timesheet importer (long)
        if: steps.recent.outputs.run == 'true'
        env:
          JAZZER_FUZZ: '1'
        run: ./mvnw -B -ntp -pl payslate-api -am test -Dtest=TimesheetImporterFuzzTest -Djazzer.max_duration=5m -Dsurefire.failIfNoSpecifiedTests=false
